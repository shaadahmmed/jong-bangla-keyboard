name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: Documentation and release tooling
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 tools/check-docs.py
      - run: python3 -m unittest discover -s tools/tests -v
      - run: git diff --check

  build:
    name: Rust and Fcitx5
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      # Arch supplies the documented Fcitx5 headers; older Ubuntu packages do not.
      - name: Prepare Arch build environment
        run: pacman -Syu --noconfirm --needed git rust cmake ninja fcitx5 python actionlint shellcheck
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Record environment
        run: |
          pacman -Q rust fcitx5 gcc cmake ninja python actionlint shellcheck | tee -a "$GITHUB_STEP_SUMMARY"
          rustc --version
          cargo --version
      - name: Check workflows
        run: actionlint
      - name: Check Rust workspace
        run: |
          cargo fmt --all -- --check
          cargo clippy --offline --locked --workspace --all-targets -- -D warnings
          cargo test --offline --locked --workspace
          cargo build --offline --locked --workspace --release
          cargo doc --offline --locked --workspace --no-deps
          test "$(cargo run --offline --locked --quiet --example convert -- 'kh12T')" = 'খ১২ট'
      - name: Build and test Fcitx5 adapter
        run: |
          cmake -S adapters/fcitx5 -B target/ci-fcitx5 -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr -DFCITX_INSTALL_USE_FCITX_SYS_PATHS=ON
          cmake --build target/ci-fcitx5
          ctest --test-dir target/ci-fcitx5 --output-on-failure
          python3 tools/check-install.py target/ci-fcitx5
